[workspace]
members = ["crates/flow-core", "crates/flow-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
blake3 = "=1.8.2"
proptest = "=1.8.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde-wasm-bindgen = "=0.6.5"
thiserror = "=2.0.17"
uuid = { version = "=1.18.1", features = ["serde"] }
wasm-bindgen = "=0.2.108"
