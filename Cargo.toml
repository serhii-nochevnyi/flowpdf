[workspace]
members = ["crates/flow-core", "crates/flow-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97.1"

[workspace.dependencies]
blake3 = "=1.8.2"
hyphenation = { version = "=0.8.4", default-features = false }
icu_segmenter = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
proptest = "=1.8.0"
rustybuzz = { version = "=0.20.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
serde-wasm-bindgen = "=0.6.5"
thiserror = "=2.0.17"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std", "opentype-layout"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["std", "hardcoded-data"] }
uuid = { version = "=1.18.1", features = ["serde"] }
wasm-bindgen = "=0.2.108"
